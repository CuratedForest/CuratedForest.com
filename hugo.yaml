baseURL: https://CuratedForest.com/
languageCode: en-us
title: Curated Forest
# Populate .Lastmod (and .GitInfo) from git history so the drafts page
# (content/drafts.md) can sort drafts by true last-modified date.
enableGitInfo: true
theme:
  - github.com/onweru/compose
module:
  imports:
    - path: github.com/lkhrs/hugo-dark-visitors
    #- path: github.com/adityatelange/hugo-PaperMod
    - path: github.com/onweru/compose
# Required for the compose theme's site search:
# layouts/index.json renders the Fuse.js search index, but Hugo only emits
# it when "JSON" is in the home page's output formats. Without this the
# /index.json file is missing, the front-end search.min.js fetches it,
# gets the 404 HTML page back, and throws "Unexpected token '<'".
outputs:
  home:
    - HTML
    - RSS
    - JSON
# Markdown configuration. The Goldmark defaults render inline HTML as
# text (`unsafe: false`) which broke a couple of raw <details> snippets
# in older content; we opt in to unsafe HTML so authored HTML passes
# through. `tableOfContents` bounds the auto-generated TOC surfaced by
# the document.html override to h2..h4 headings so it stays useful on
# long pages without listing every micro-subhead.
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
# Sitemap and robots.txt. `disableKinds` drops the sitemap so search
# engines have no crawl map even if they ignore robots.txt. The
# `robots.txt` at static/robots.txt does the primary heavy lifting.
disableKinds:
  - sitemap
params:

  # The site is dark-themed only. enableDarkMode flips the <html class>
  # to "dark" at render time; defaultLightingMode pins the data-mode
  # attribute so the theme's mode.js doesn't fall back to system pref or
  # a stale localStorage value. The mode-toggle checkbox is removed from
  # the nav via the layouts/_partials/mode.html override and a CSS rule
  # in _custom.sass; assets/js/custom.js also clears any stored mode key
  # from previous visits so returning users don't get stuck in light
  # mode.
  enableDarkMode: true
  defaultLightingMode: dark
  # Sections that should render with the docs layout (sidebar + pager).
  # The compose theme defaults to just "docs" alone, but our docs live
  # under tech/, so we replace the default with our actual sections.
  #
  # The leading empty string "" looks weird but it's intentional: the
  # home page's .Section is the empty string, so without an empty entry
  # in this slice the theme's `in $docSections .Section` check fails on
  # home and the sidebar disappears. (When docSections is the theme's
  # default string "docs" instead of a slice, `in` does substring
  # matching and "" matches vacuously - this restores that behavior.)
  docSections:
    - ""
    - tech
    - software
    - plants
  # Enable the theme's built-in Fuse.js site search (renders search box
  # behavior in _partials/search.html + js/search.min.js).
  search:
    # Quote the key: YAML 1.1 maps the bareword `on` to the boolean
    # `true`, so the unquoted form parses as { true: true } and the
    # compose theme's lookup `site.Params.search.on` resolves to nil. The
    # theme treats nil as not-disabled so search still works, but quoting
    # the key makes the config's intent explicit and matches what the
    # theme actually reads.
    "on": true
    global: true   # search across all sections (set false to scope to the current section)
  # Nav logo - rendered by _partials/nav.html via a <picture> element with
  # data-lit / data-dark sources. The strawberry/circuitry icon has a dark
  # rounded-card background that reads well in both light and dark modes,
  # so the same asset is used for both. The PNG is generated at 256x256 by
  # scripts/split_icons.py; CSS in assets/sass/_custom.sass constrains the
  # rendered size in the nav.
  #
  # NOTE: do NOT set params.iconsPath here. The theme uses that value to
  # locate SVG glyphs (info.svg, sun.svg, moon.svg, next.svg) under
  # static/icons/, while the favicon path is hardcoded to "favicons/" in
  # the theme's _partials/head/index.html.
  logo:
    lightMode: images/logo.png
    darkMode: images/logo.png
